server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Vite build output + public assets (formio.full.css, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mjs|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
